<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tomorrow | Student Lecture Finder</title>

<link rel="stylesheet" href="/style.css">

<style>
.tomorrow-page{
    max-width:900px;
    margin:auto;
    padding:24px 18px 40px;
}

.top-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.brand-title{
    margin:0;
    font-size:30px;
    font-weight:800;
}

.brand-subtitle{
    margin:5px 0 0;
    color:#6b7280;
    font-size:14px;
}

.change-btn{
    border:none;
    padding:10px 15px;
    border-radius:12px;
    background:#111827;
    color:white;
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
}

.page-navigation{
    margin-bottom:22px;
}

.nav-btn{
    border:1px solid #e5e7eb;
    background:white;
    color:#111827;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.student-card{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:18px;
    margin-bottom:24px;
}

.student-name{
    font-size:20px;
    font-weight:800;
    margin-bottom:6px;
}

.student-meta{
    color:#6b7280;
    font-size:14px;
}

.day-heading{
    margin-bottom:18px;
}

.day-heading h2{
    margin:0;
    font-size:24px;
    font-weight:800;
}

.day-heading p{
    margin:5px 0 0;
    color:#6b7280;
    font-size:14px;
}

.stats-row{
    display:grid;
    grid-template-columns:1fr;
    border-top:1px solid #e5e7eb;
    border-bottom:1px solid #e5e7eb;
    margin:18px 0 24px;
}

.stat-box{
    text-align:center;
    padding:14px 8px;
}

.stat-label{
    display:block;
    font-size:12px;
    color:#6b7280;
    font-weight:700;
    margin-bottom:4px;
}

.stat-number{
    display:block;
    font-size:25px;
    font-weight:800;
}

.schedule-title{
    margin:0 0 13px;
    font-size:19px;
    font-weight:800;
}

.schedule-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.lecture-card{
    display:grid;
    grid-template-columns:95px minmax(0,1fr) auto;
    align-items:center;
    gap:12px;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:15px;
    padding:14px;
}

.lecture-time{
    font-size:13px;
    font-weight:800;
}

.lecture-end-time{
    color:#9ca3af;
    font-size:11px;
    margin-top:3px;
}

.lecture-subject{
    font-size:15px;
    font-weight:800;
}

.lecture-info{
    color:#6b7280;
    font-size:11px;
    margin-top:5px;
}

.upcoming{
    color:#2563eb;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.message-box{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

@media(max-width:600px){

    .tomorrow-page{
        padding:18px 13px 35px;
    }

    .top-header{
        align-items:flex-start;
    }

    .brand-title{
        font-size:24px;
    }

    .change-btn{
        padding:9px 10px;
        font-size:11px;
    }

    .student-card{
        padding:15px;
    }

    .student-name{
        font-size:18px;
    }

    .lecture-card{
        grid-template-columns:72px minmax(0,1fr);
    }

    .upcoming{
        grid-column:2;
    }
}
</style>
</head>

<body>

<div class="tomorrow-page">

    <div class="top-header">

        <div>

            <h1 class="brand-title">
                Tomorrow's Lectures 📚
            </h1>

            <p class="brand-subtitle">
                Student Lecture Finder
            </p>

        </div>

        <button class="change-btn"
                onclick="changeEnrollment()">

            🔄 Change Enrollment

        </button>

    </div>


    <!-- BACK TO TODAY -->

    <div class="page-navigation">

        <button class="nav-btn"
                onclick="window.location.href='/today.html'">

            ← Back to Today

        </button>

    </div>


    <!-- STUDENT -->

    <div class="student-card">

        <div class="student-name"
             id="studentName">

            Loading...

        </div>

        <div class="student-meta">

            🎓 <strong id="studentEnrollment">
                Loading...
            </strong>

            &nbsp; • &nbsp;

            🧑‍💻 <strong id="studentBatch">
                Loading...
            </strong>

        </div>

    </div>


    <!-- DAY -->

    <div class="day-heading">

        <h2>TOMORROW</h2>

        <p id="tomorrowDate">
            Loading date...
        </p>

    </div>


    <!-- TOTAL -->

    <div class="stats-row">

        <div class="stat-box">

            <span class="stat-label">
                📚 TOTAL LECTURES
            </span>

            <span class="stat-number"
                  id="totalLectures">

                0

            </span>

        </div>

    </div>


    <h3 class="schedule-title">
        Tomorrow's Schedule
    </h3>


    <div id="lectureContainer"
         class="schedule-list">

        <div class="message-box">
            Loading lectures...
        </div>

    </div>

</div>


<script>

const enrollment =
    localStorage.getItem("enrollment");

const studentName =
    document.getElementById("studentName");

const studentEnrollment =
    document.getElementById("studentEnrollment");

const studentBatch =
    document.getElementById("studentBatch");

const totalLectures =
    document.getElementById("totalLectures");

const tomorrowDate =
    document.getElementById("tomorrowDate");

const lectureContainer =
    document.getElementById("lectureContainer");


function changeEnrollment(){

    localStorage.removeItem("enrollment");
    localStorage.removeItem("studentName");
    localStorage.removeItem("studentBatch");

    window.location.href="/";

}


/* TOMORROW DATE */

const tomorrow = new Date();

tomorrow.setDate(
    tomorrow.getDate() + 1
);

tomorrowDate.textContent =
    tomorrow.toLocaleDateString(
        "en-IN",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );


/* CHECK */

if(!enrollment){

    studentEnrollment.textContent =
        "Not found";

    studentName.textContent =
        "Student";

    studentBatch.textContent =
        "—";

    lectureContainer.innerHTML = `

        <div class="message-box">

            ⚠️ Enrollment number not found.

            <br><br>

            Please enter your enrollment number.

        </div>

    `;

}else{

    studentEnrollment.textContent =
        enrollment;

    loadTomorrowLectures();

}


/* LOAD */

function loadTomorrowLectures(){

    fetch(
        `/api/lectures/${encodeURIComponent(enrollment)}`
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        if(!data.success){

            lectureContainer.innerHTML = `

                <div class="message-box">

                    ❌ Enrollment number not found.

                </div>

            `;

            return;

        }


        if(data.student){

            studentName.textContent =
                data.student.name || "Student";

            studentBatch.textContent =
                data.student.batch || "—";

            localStorage.setItem(
                "studentName",
                data.student.name || ""
            );

            localStorage.setItem(
                "studentBatch",
                data.student.batch || ""
            );

        }


        const tomorrowDay =
            tomorrow.toLocaleDateString(
                "en-US",
                {
                    weekday:"long"
                }
            );


        const tomorrowLectures =
            (data.lectures || [])
            .filter(
                lecture =>
                    lecture.day === tomorrowDay
            );


        tomorrowLectures.sort(
            (a,b) =>
                convertTime(a.start_time)
                -
                convertTime(b.start_time)
        );


        totalLectures.textContent =
            tomorrowLectures.length;


        if(tomorrowLectures.length === 0){

            lectureContainer.innerHTML = `

                <div class="message-box">

                    📭 No lectures are scheduled
                    for tomorrow.

                    <br><br>

                    Check the Full Timetable
                    for more details.

                </div>

            `;

            return;

        }


        lectureContainer.innerHTML = "";


        tomorrowLectures.forEach(
            lecture => {

                const card =
                    document.createElement("div");

                card.className =
                    "lecture-card";

                card.innerHTML = `

                    <div>

                        <div class="lecture-time">
                            ${lecture.start_time}
                        </div>

                        <div class="lecture-end-time">
                            ${lecture.end_time}
                        </div>

                    </div>


                    <div>

                        <div class="lecture-subject">
                            ${lecture.subject}
                        </div>

                        <div class="lecture-info">

                            👨‍🏫 ${lecture.professor}

                            &nbsp; • &nbsp;

                            🚪 Room ${lecture.room}

                        </div>

                    </div>


                    <div class="upcoming">
                        ⏳ UPCOMING
                    </div>

                `;

                lectureContainer.appendChild(card);

            }
        );

    })

    .catch(error => {

        console.error(
            "Lecture loading error:",
            error
        );

        lectureContainer.innerHTML = `

            <div class="message-box">

                ⚠️ Unable to load lectures.

                <br><br>

                Please make sure the Flask
                server is running.

            </div>

        `;

    });

}


function convertTime(timeString){

    if(!timeString)
        return 0;

    const parts =
        timeString.trim().split(" ");

    const time =
        parts[0];

    const modifier =
        parts[1];

    let [hours,minutes] =
        time.split(":").map(Number);


    if(
        modifier === "PM" &&
        hours !== 12
    ){
        hours += 12;
    }


    if(
        modifier === "AM" &&
        hours === 12
    ){
        hours = 0;
    }


    return hours * 60 + minutes;

}

</script>

</body>
</html>
